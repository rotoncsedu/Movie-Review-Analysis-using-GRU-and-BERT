<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Verdict — Sentiment Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1B19;
    --paper: #F1E9D2;
    --paper-shadow: #d9cfae;
    --room: #10140F;
    --room-light: #1a201a;
    --red: #8C2F26;
    --green: #2E5A3E;
    --gold: #b9974a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--room);
    background-image:
      radial-gradient(ellipse at 50% -10%, var(--room-light) 0%, var(--room) 60%);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .masthead {
    position: fixed;
    top: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Special Elite', cursive;
    letter-spacing: 0.06em;
    font-size: 15px;
    color: var(--gold);
    opacity: 0.85;
  }

  .slip {
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    max-width: 480px;
    padding: 36px 34px 30px;
    transform: rotate(-0.6deg);
    box-shadow:
      0 1px 0 var(--paper-shadow),
      0 18px 40px rgba(0,0,0,0.45);
    position: relative;
  }

  .slip::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(28,27,25,0.25);
    pointer-events: none;
  }

  h1 {
    font-family: 'Special Elite', cursive;
    font-size: 26px;
    margin: 0 0 4px;
    line-height: 1.25;
  }

  .sub {
    font-size: 12.5px;
    color: rgba(28,27,25,0.65);
    margin: 0 0 26px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 11.5px;
    text-transform: lowercase;
    color: rgba(28,27,25,0.7);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    min-height: 130px;
    resize: vertical;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(28,27,25,0.3);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    outline: none;
  }

  textarea:focus {
    border-color: var(--ink);
    background: rgba(255,255,255,0.55);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
  }

  button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    padding: 12px 22px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  button:hover:not(:disabled) { background: #000; }
  button:disabled { opacity: 0.5; cursor: default; }

  .count {
    font-size: 11.5px;
    color: rgba(28,27,25,0.5);
  }

  .result {
    margin-top: 22px;
    min-height: 76px;
    display: flex;
    align-items: stretch;
    gap: 14px;
  }

  .verdict {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 10px;
    border: 1px dashed rgba(28,27,25,0.25);
  }

  .verdict-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(28,27,25,0.55);
  }

  .stamp {
    font-family: 'Special Elite', cursive;
    font-size: 19px;
    border: 3px solid currentColor;
    padding: 7px 12px;
    transform: rotate(-8deg) scale(1);
    display: inline-block;
    animation: thud 260ms ease-out;
  }

  .stamp.positive { color: var(--green); }
  .stamp.negative { color: var(--red); }

  @keyframes thud {
    0%   { transform: rotate(-8deg) scale(2.4); opacity: 0; }
    60%  { transform: rotate(-8deg) scale(0.92); opacity: 1; }
    100% { transform: rotate(-8deg) scale(1); }
  }

  .confidence {
    font-size: 12px;
    color: rgba(28,27,25,0.7);
    line-height: 1.5;
    text-align: center;
  }

  .confidence b {
    color: var(--ink);
    font-size: 14px;
  }

  .error {
    margin-top: 22px;
    font-size: 14px;
    color: var(--red);
    line-height: 1.6;
  }

  .footer-note {
    margin-top: 26px;
    padding-top: 14px;
    border-top: 1px dashed rgba(28,27,25,0.25);
    font-size: 10.5px;
    color: rgba(28,27,25,0.5);
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; }
  }
</style>
</head>
<body>

  <div class="masthead">Movie Sentiment Analyzer</div>

  <div class="slip">
    <h1>Submit a Review</h1>
    <p class="sub">Type or paste a movie review below. The reader will judge it POSITIVE or NEGATIVE, with a confidence score.</p>

    <label for="reviewText">the review</label>
    <textarea id="reviewText" placeholder="This film was a slow burn, but the third act..."></textarea>

    <div class="row">
      <span class="count" id="charCount">0 characters</span>
      <button id="analyzeBtn">Read it</button>
    </div>

    <div class="result" id="result"></div>

    <div class="footer-note">
      Talking to <code id="apiUrlLabel"></code>. Change API_BASE at the top of the script below if your server runs elsewhere.
    </div>
  </div>

  <script>
    // Change this if your FastAPI server runs on a different host/port.
    const API_BASE = "http://127.0.0.1:8000";

    const textarea = document.getElementById("reviewText");
    const charCount = document.getElementById("charCount");
    const btn = document.getElementById("analyzeBtn");
    const resultEl = document.getElementById("result");
    document.getElementById("apiUrlLabel").textContent = API_BASE;

    textarea.addEventListener("input", () => {
      charCount.textContent = `${textarea.value.length} characters`;
    });

    async function analyze() {
      const text = textarea.value.trim();
      if (!text) {
        resultEl.innerHTML = `<div class="error">Write something first — an empty slip has nothing to judge.</div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = "Reading…";
      resultEl.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (!res.ok) {
          const detail = await res.text();
          throw new Error(`Server responded ${res.status}: ${detail}`);
        }

        const data = await res.json();

        const renderVerdict = (name, result) => {
          const isPositive = result.label === "POSITIVE";
          const pct = (result.probability * 100).toFixed(1);
          return `
            <div class="verdict">
              <span class="verdict-label">${name}</span>
              <div class="stamp ${isPositive ? "positive" : "negative"}">${result.label}</div>
              <div class="confidence">confidence<br><b>${pct}%</b></div>
            </div>
          `;
        };

        resultEl.innerHTML =
          renderVerdict("GRU", data.gru) + renderVerdict("BERT", data.bert);
      } catch (err) {
        resultEl.innerHTML = `<div class="error">Couldn't reach the reading room. Is the server running at ${API_BASE}?<br>(${err.message})</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Read it";
      }
    }

    btn.addEventListener("click", analyze);
    textarea.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) analyze();
    });
  </script>

</body>
</html>
